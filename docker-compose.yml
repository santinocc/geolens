services:
  titiler:
    image: ghcr.io/developmentseed/titiler:2.4.0
    ports:
      - "127.0.0.1:8000:80"
    environment:
      WEB_CONCURRENCY: "2"   # two worker processes is plenty locally

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - titiler

  # Spatial database. Port 5433 on the host, because 5432 is often taken
  # by another local Postgres.
  db:
    build: ./db
    environment:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens   # local development only, not a real secret
      POSTGRES_DB: geolens
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files here run once, in name order, when the volume is empty.
      # To run them again: docker compose down -v
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolens -d geolens"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The API. Inside Docker it reaches the database as db:5432 (the container port,
  # not the 5433 published on the host). The port is published on the loopback only,
  # so the front end running on your machine can reach it; a real deployment would
  # not publish it at all and let only the front end server call it.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://geolens:geolens@db:5432/geolens   # local development only, not a real secret
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
