name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        # CI runners are Intel, so the prebuilt PostGIS image works here.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: geolens
          POSTGRES_PASSWORD: geolens # throwaway CI database, not a real secret
          POSTGRES_DB: geolens
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U geolens -d geolens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_DB: "1" # a missing database fails the run instead of skipping tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
